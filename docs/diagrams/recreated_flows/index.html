<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tc_rag · 原图复刻与详细流程</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px "Microsoft YaHei",sans-serif;background:#121212;color:#e8e8e8;height:100vh;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}
header{padding:17px 24px;background:#202020;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:18px;margin:0}header a{color:#d0d0d0;font-size:13px}
nav{padding:10px 24px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #454545;background:#1c1c1c}
button,a.download{border:1px solid #606060;border-radius:6px;padding:8px 12px;color:#e8e8e8;background:#292929;font:inherit;cursor:pointer;text-decoration:none}button:hover,a.download:hover{background:#373737}button.active{background:#454545;border-color:#c3c3c3}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}#scale{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}#viewport{position:relative;overflow:hidden;touch-action:none;cursor:grab}#viewport:active{cursor:grabbing}#diagram{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;user-select:none}
#hint{position:absolute;bottom:14px;left:18px;pointer-events:none;background:#1c1c1cef;color:#b0b0b0;border:1px solid #454545;padding:8px 12px;border-radius:6px;font-size:12px}
@media(max-width:800px){.tools{margin-left:0}header{display:block}header a{display:block;margin-top:8px}}
</style>
<header><h1>原图复刻与当前详细流程 · 可编辑 Draw.io</h1><a href="tc_rag_recreated_and_detailed.drawio" download>下载三页可编辑图集</a></header>
<nav aria-label="选择图页">
 <button class="page active" data-page="0">① 原图：主流程</button>
 <button class="page" data-page="1">② 原图：分层架构</button>
 <button class="page" data-page="2">③ 详细：双遍视觉＋两轮 RAG</button>
 <div class="tools"><button id="out" title="缩小">−</button><span id="scale">100%</span><button id="in" title="放大">＋</button><button id="fit">整图</button><button id="width">适应宽度</button><button id="actual">100%</button><a class="download" id="svg" download>SVG</a><a class="download" id="drawio" download>Draw.io</a></div>
</nav>
<main id="viewport" aria-label="图件预览，可拖动缩放"><img id="diagram" alt="流程图" draggable="false"><div id="hint">滚轮缩放 · 拖动平移 · 双击查看整图；前两页保留原图文字，第三页按当前代码展开。</div></main>
<script>
"use strict";
const names=["01_workflow_replica","02_architecture_replica","03_detailed_workflow"];
const viewport=document.getElementById("viewport"),diagram=document.getElementById("diagram");
let page=0,z=1,x=0,y=0,drag=null;
function draw(){diagram.style.transform=`translate(${x}px,${y}px) scale(${z})`;document.getElementById("scale").textContent=Math.round(z*100)+"%"}
function fit(widthOnly=false){if(!diagram.naturalWidth)return;z=Math.min((viewport.clientWidth-48)/diagram.naturalWidth,widthOnly?Infinity:(viewport.clientHeight-48)/diagram.naturalHeight);x=(viewport.clientWidth-diagram.naturalWidth*z)/2;y=widthOnly?24:(viewport.clientHeight-diagram.naturalHeight*z)/2;draw()}
function zoom(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const next=Math.min(5,Math.max(.08,z*factor));x=cx-(cx-x)*next/z;y=cy-(cy-y)*next/z;z=next;draw()}
function select(i){page=i;document.querySelectorAll(".page").forEach((b,k)=>b.classList.toggle("active",k===i));diagram.alt=["截图复刻：需求文档到交付主流程","截图复刻：系统分层架构","当前详细流程：双遍视觉识别与两轮RAG"][i];diagram.onload=()=>fit(i===2);diagram.src=names[i]+".svg";document.getElementById("svg").href=names[i]+".svg";document.getElementById("drawio").href=names[i]+".drawio"}
document.querySelectorAll(".page").forEach(b=>b.onclick=()=>select(Number(b.dataset.page)));
document.getElementById("in").onclick=()=>zoom(1.2);document.getElementById("out").onclick=()=>zoom(1/1.2);document.getElementById("fit").onclick=()=>fit();document.getElementById("width").onclick=()=>fit(true);document.getElementById("actual").onclick=()=>zoom(1/z);
viewport.addEventListener("wheel",e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
viewport.addEventListener("pointerdown",e=>{drag={px:e.clientX,py:e.clientY,x,y};viewport.setPointerCapture(e.pointerId)});viewport.addEventListener("pointermove",e=>{if(drag){x=drag.x+e.clientX-drag.px;y=drag.y+e.clientY-drag.py;draw()}});viewport.addEventListener("pointerup",()=>drag=null);viewport.addEventListener("pointercancel",()=>drag=null);viewport.ondblclick=()=>fit();window.addEventListener("resize",()=>fit(page===2));const initial=Number(location.hash.slice(1));select(Number.isInteger(initial)&&initial>=0&&initial<=2?initial:0);
</script>
</html>
