<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="3040" viewBox="0 0 1680 3040"><title>tc_rag 当前详细流程：图片转文字与两轮RAG</title><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><defs><marker id="a728398" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#728398"/></marker><marker id="aa36b14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#a36b14"/></marker><marker id="a11806b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#11806b"/></marker><marker id="a2463b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#2463b3"/></marker></defs><rect width="1680" height="3040" fill="#f3f6fa"/><text x="60" y="65" font-size="39" fill="#132b45" font-weight="700" text-anchor="start">需求文档 → 测试点 → 测试用例</text><text x="60" y="108" font-size="22" fill="#607389" font-weight="400" text-anchor="start">tc_rag 当前已实现流程  ·  一次处理一份需求文档  ·  2026-11-17</text><rect x="40" y="150" width="1600" height="865" rx="22" fill="#ffffff" stroke="#d7e0ea"/><rect x="78" y="174" width="52" height="42" rx="11" fill="#a36b14"/><text x="104" y="204" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">01</text><text x="150" y="205" font-size="29" fill="#18324c" font-weight="700" text-anchor="start">读取文档与图片转文字</text><text x="150" y="237" font-size="20" fill="#607389" font-weight="400" text-anchor="start">图片解释按配置启用；原文和图片说明都保留来源。</text><rect x="40" y="1040" width="1600" height="660" rx="22" fill="#ffffff" stroke="#d7e0ea"/><rect x="78" y="1064" width="52" height="42" rx="11" fill="#2463b3"/><text x="104" y="1094" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">02</text><text x="150" y="1095" font-size="29" fill="#18324c" font-weight="700" text-anchor="start">分块、提取功能与规则</text><text x="150" y="1127" font-size="20" fill="#607389" font-weight="400" text-anchor="start">先提取并核对需求，再为后续两轮检索准备证据。</text><rect x="40" y="1750" width="1600" height="500" rx="22" fill="#ffffff" stroke="#d7e0ea"/><rect x="78" y="1774" width="52" height="42" rx="11" fill="#2463b3"/><text x="104" y="1804" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">03</text><text x="150" y="1805" font-size="29" fill="#18324c" font-weight="700" text-anchor="start">第一轮 RAG：规划测试点</text><text x="150" y="1837" font-size="20" fill="#607389" font-weight="400" text-anchor="start">查询来自生成要求与需求规则；检索返回的是需求依据。</text><rect x="40" y="2320" width="1600" height="520" rx="22" fill="#ffffff" stroke="#d7e0ea"/><rect x="78" y="2344" width="52" height="42" rx="11" fill="#11806b"/><text x="104" y="2374" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">04</text><text x="150" y="2375" font-size="29" fill="#18324c" font-weight="700" text-anchor="start">第二轮 RAG：生成测试用例</text><text x="150" y="2407" font-size="20" fill="#607389" font-weight="400" text-anchor="start">查询来自测试点目标；检索仍返回需求依据，不是历史用例。</text><polyline points="840,340 840,360" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="840,465 840,475 420,475 420,485" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="840,465 840,475 1260,475 1260,485" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="1260,580 1260,615" fill="none" stroke="#a36b14" stroke-width="2.5"  marker-end="url(#aa36b14)"/><polyline points="1260,720 1260,755" fill="none" stroke="#a36b14" stroke-width="2.5"  marker-end="url(#aa36b14)"/><polyline points="1020,667 920,667 920,880 840,880 840,900" fill="none" stroke="#a36b14" stroke-width="2.5"  marker-end="url(#aa36b14)"/><polyline points="1260,865 1260,940 1080,940" fill="none" stroke="#a36b14" stroke-width="2.5"  marker-end="url(#aa36b14)"/><polyline points="420,600 420,940 600,940" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="840,980 840,1025 60,1025 60,1217 100,1217" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="500,1217 640,1217" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="1040,1217 1180,1217" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="1380,1275 1380,1330 415,1330 415,1390" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="1380,1275 1380,1330 1265,1330 1265,1390" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="380,1952 480,1952" fill="none" stroke="#2463b3" stroke-width="2.5"  marker-end="url(#a2463b3)"/><polyline points="780,1952 880,1952" fill="none" stroke="#2463b3" stroke-width="2.5"  marker-end="url(#a2463b3)"/><polyline points="1180,1952 1280,1952" fill="none" stroke="#2463b3" stroke-width="2.5"  marker-end="url(#a2463b3)"/><polyline points="1560,1462 1620,1462 1620,1855 630,1855 630,1870" fill="none" stroke="#2463b3" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a2463b3)"/><polyline points="380,2542 480,2542" fill="none" stroke="#11806b" stroke-width="2.5"  marker-end="url(#a11806b)"/><polyline points="780,2542 880,2542" fill="none" stroke="#11806b" stroke-width="2.5"  marker-end="url(#a11806b)"/><polyline points="1180,2542 1280,2542" fill="none" stroke="#11806b" stroke-width="2.5"  marker-end="url(#a11806b)"/><polyline points="1560,1462 1620,1462 1620,2445 630,2445 630,2460" fill="none" stroke="#2463b3" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#a2463b3)"/><polyline points="415,1535 415,1700 60,1700 60,1952 80,1952" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="1430,2035 1430,2170 1110,2170" fill="none" stroke="#728398" stroke-width="2.5"  marker-end="url(#a728398)"/><polyline points="840,2220 840,2280 60,2280 60,2542 80,2542" fill="none" stroke="#11806b" stroke-width="2.5"  marker-end="url(#a11806b)"/><polyline points="1430,2625 1430,2745 1110,2745" fill="none" stroke="#11806b" stroke-width="2.5"  marker-end="url(#a11806b)"/><rect x="650" y="265" width="380" height="75" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="840.0" y="292.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">输入需求文档</text><text x="840.0" y="330.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">PDF / DOCX ＋ 本次生成要求</text><rect x="650" y="360" width="380" height="105" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="840.0" y="388.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">读取文档内容</text><text x="840.0" y="426.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">读取段落、表格和图片</text><text x="840.0" y="454.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保留标题与原文位置</text><rect x="180" y="485" width="480" height="115" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="420.0" y="518.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">保留正文与表格</text><text x="420.0" y="556.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">正文保留原句</text><text x="420.0" y="584.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">表格保留行列关系和原文位置</text><rect x="1020" y="485" width="480" height="95" rx="15" fill="#ffffff" stroke="#a36b14" stroke-width="1.8"/><text x="1260.0" y="522.5" font-size="27" fill="#a36b14" font-weight="700" text-anchor="middle">提取图片</text><text x="1260.0" y="560.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保存图片文件和所在位置</text><rect x="1020" y="615" width="480" height="105" rx="15" fill="#ffffff" stroke="#a36b14" stroke-width="1.8"/><text x="1260.0" y="643.5" font-size="27" fill="#a36b14" font-weight="700" text-anchor="middle">检查图片与已有结果</text><text x="1260.0" y="681.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">检查图片是否可用</text><text x="1260.0" y="709.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">已有识别结果可直接复用</text><rect x="1020" y="755" width="480" height="110" rx="15" fill="#fffaf0" stroke="#a36b14" stroke-width="1.8"/><text x="1260.0" y="786.0" font-size="27" fill="#a36b14" font-weight="700" text-anchor="middle">图片转文字与复核</text><text x="1260.0" y="824.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">按配置缩放或分图后识别</text><text x="1260.0" y="852.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">说明图片内容，可再复核并记录疑问</text><rect x="600" y="900" width="480" height="80" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="840.0" y="930.0" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">汇总可用文字</text><text x="840.0" y="968.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">原文与图片说明分开标记，保留来源</text><rect x="100" y="1160" width="400" height="115" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="300.0" y="1193.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">把文字拆成小段</text><text x="300.0" y="1231.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">按段落、表格和标题拆分</text><text x="300.0" y="1259.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">每段保留对应的原文位置</text><rect x="640" y="1160" width="400" height="115" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="840.0" y="1193.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">逐段提取需求</text><text x="840.0" y="1231.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">模型提取功能、业务规则</text><text x="840.0" y="1259.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">同时给出对应的原文依据</text><rect x="1180" y="1160" width="400" height="115" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="1380.0" y="1193.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">核对并整理结果</text><text x="1380.0" y="1231.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">检查引文及对象关联</text><text x="1380.0" y="1259.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">归并重复，记录冲突和缺失</text><rect x="120" y="1390" width="590" height="145" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="415.0" y="1424.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">功能与需求规则</text><text x="415.0" y="1462.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保存功能、规则和原文依据</text><text x="415.0" y="1490.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">供后续规划与生成使用</text><text x="415.0" y="1518.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">不会直接把规则当成完整测试用例</text><rect x="970" y="1390" width="590" height="145" rx="15" fill="#edf5ff" stroke="#2463b3" stroke-width="1.8"/><text x="1265.0" y="1424.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">准备需求证据索引</text><text x="1265.0" y="1462.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">原文依据及来源文字转成向量</text><text x="1265.0" y="1490.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">可选：增加关键词检索</text><text x="1265.0" y="1518.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">两轮RAG使用同一份需求范围</text><rect x="80" y="1870" width="300" height="165" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="230.0" y="1914.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">准备规划输入</text><text x="230.0" y="1952.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">生成要求与一批规则</text><text x="230.0" y="1980.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">程序先生成基础测试点</text><text x="230.0" y="2008.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">原文依据直接保留</text><rect x="480" y="1870" width="300" height="165" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="630.0" y="1914.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">查找相关需求</text><text x="630.0" y="1952.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">查询文字转成向量</text><text x="630.0" y="1980.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">向量与可选关键词检索</text><text x="630.0" y="2008.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">可选：重新排序</text><rect x="880" y="1870" width="300" height="165" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="1030.0" y="1914.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">整理本轮依据</text><text x="1030.0" y="1952.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">已有原文优先保留</text><text x="1030.0" y="1980.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">补充相关条件与例外</text><text x="1030.0" y="2008.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">超出预算先减少补充</text><rect x="1280" y="1870" width="300" height="165" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="1430.0" y="1914.5" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">生成测试点</text><text x="1430.0" y="1952.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保留已有基础测试点</text><text x="1430.0" y="1980.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">模型补充测试目标</text><text x="1430.0" y="2008.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">每点关联需求规则</text><rect x="80" y="2460" width="300" height="165" rx="15" fill="#ffffff" stroke="#11806b" stroke-width="1.8"/><text x="230.0" y="2504.5" font-size="27" fill="#11806b" font-weight="700" text-anchor="middle">准备用例输入</text><text x="230.0" y="2542.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">选出可生成的测试点</text><text x="230.0" y="2570.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">补齐所属功能的规则</text><text x="230.0" y="2598.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保留原文依据</text><rect x="480" y="2460" width="300" height="165" rx="15" fill="#ffffff" stroke="#11806b" stroke-width="1.8"/><text x="630.0" y="2504.5" font-size="27" fill="#11806b" font-weight="700" text-anchor="middle">查找相关需求</text><text x="630.0" y="2542.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">查询文字转成向量</text><text x="630.0" y="2570.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">向量与可选关键词检索</text><text x="630.0" y="2598.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">可选：重新排序</text><rect x="880" y="2460" width="300" height="165" rx="15" fill="#ffffff" stroke="#11806b" stroke-width="1.8"/><text x="1030.0" y="2504.5" font-size="27" fill="#11806b" font-weight="700" text-anchor="middle">整理本轮依据</text><text x="1030.0" y="2542.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">已有原文优先保留</text><text x="1030.0" y="2570.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">补充相关条件与例外</text><text x="1030.0" y="2598.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">超出预算先减少补充</text><rect x="1280" y="2460" width="300" height="165" rx="15" fill="#ffffff" stroke="#11806b" stroke-width="1.8"/><text x="1430.0" y="2504.5" font-size="27" fill="#11806b" font-weight="700" text-anchor="middle">生成并检查用例</text><text x="1430.0" y="2542.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">模型生成步骤和预期</text><text x="1430.0" y="2570.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">检查格式、引用和覆盖</text><text x="1430.0" y="2598.5" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保留问题与失败记录</text><rect x="570" y="2120" width="540" height="100" rx="15" fill="#ffffff" stroke="#2463b3" stroke-width="1.8"/><text x="840.0" y="2146.0" font-size="27" fill="#2463b3" font-weight="700" text-anchor="middle">保存测试点</text><text x="840.0" y="2184.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">保存所属功能、需求规则与原文引用</text><text x="840.0" y="2212.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">待澄清的测试点继续保留，不强行生成用例</text><rect x="570" y="2690" width="540" height="110" rx="15" fill="#effaf6" stroke="#11806b" stroke-width="1.8"/><text x="840.0" y="2721.0" font-size="27" fill="#11806b" font-weight="700" text-anchor="middle">输出交付文件</text><text x="840.0" y="2759.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">测试点 XMind ＋ 测试用例 Excel</text><text x="840.0" y="2787.0" font-size="21" fill="#3b4e63" font-weight="400" text-anchor="middle">同时输出质量报告和待确认问题</text><rect x="876" y="717" width="88" height="28" fill="#ffffff"/><text x="920" y="737" font-size="19" fill="#a36b14" font-weight="400" text-anchor="middle">可复用</text><text x="80" y="1630" font-size="23" fill="#2463b3" font-weight="400" text-anchor="start">蓝色虚线：两轮都从同一份需求中查找证据；原文依据始终保留。</text><text x="60" y="2895" font-size="22" fill="#18324c" font-weight="700" text-anchor="start">RAG：先查找相关需求依据，再帮助模型生成。</text><text x="60" y="2930" font-size="21" fill="#607389" font-weight="400" text-anchor="start">向量：便于比较文字的数字表示。重新排序：把更相关的候选内容放在前面。</text><text x="60" y="2965" font-size="21" fill="#607389" font-weight="400" text-anchor="start">全程保存原文位置、图片说明、规则、检索结果和生成记录；有引用不等于业务已经审核通过。</text><text x="60" y="3000" font-size="20" fill="#607389" font-weight="400" text-anchor="start">说明：本图展示当前实现，不包含尚未开发的功能归并增强、跨文档生成或历史用例检索。</text></svg>