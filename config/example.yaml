project:
  name: demo
  workdir: ./workdir

storage:
  backend: sqlite
  database: ./workdir/data.sqlite

parsing:
  formats: [pdf, docx]
  vision_enabled: false
  infer_docx_headings: false          # 可选的保守视觉标题推断，默认关闭

chunking:
  strategy: structural
  target_tokens: 900
  overlap_tokens: 100
  token_counter: tiktoken_approx      # 中文需实测

models:
  llm:
    adapter: openai_sdk               # openai_sdk | langchain | claude_sdk
    api_mode: chat_completions
    response_format: json_schema     # DeepSeek Chat 等仅支持 JSON 模式的服务改为 json_object
    thinking_mode: default           # 支持此参数的 Chat 服务可设 disabled 或 enabled
    max_output_tokens: null          # 单次输出上限；DeepSeek 大批量 JSON 可先设 16384
    base_url: ${TC_RAG_LLM_BASE_URL}
    model: ${TC_RAG_LLM_MODEL}
    api_key: null                     # 可在私有配置直接填密钥，无需设置密钥环境变量
    api_key_env: TC_RAG_LLM_API_KEY
    concurrency: 3
  embedding:
    adapter: openai_sdk
    base_url: ${TC_RAG_EMBEDDING_BASE_URL}
    model: ${TC_RAG_EMBEDDING_MODEL}
    api_key: null
    api_key_env: TC_RAG_EMBEDDING_API_KEY
    batch_size: 16
    concurrency: 2
  vision:
    enabled: false
    api_key: null
  rerank:
    enabled: false
    adapter: http
    api_key: null

retrieval:
  scope: requirement_set
  backend: numpy                      # numpy | faiss
  metric: cosine                      # cosine | euclidean | dot
  normalize: true
  vector_top_k: 20
  keyword_enabled: false
  rerank_top_n: 6
  threshold_policy: disabled          # 评估后按 metric 配置

planning:
  methods: [equivalence, boundary, decision_table, state, permission]
  relation_enabled: false
  ui_display_policy: merge # merge/keep；纯界面展示点是否合并为概括点
  vision_policy: downgrade # downgrade/keep；仅图片证据的测试点是否降级为待文本核对

generation:
  skill_file: null # 可填自定义 Skill 的 .md 路径，也可通过 --skill-file 指定
  batch_point_limit: 5
  schema_repair_attempts: 1
  unsupported_expectation_policy: flag

runtime:
  max_attempts: 3
  request_timeout_seconds: 90
  vision_min_interval_seconds: 0 # 仅作用于视觉；缓存命中不等待
  cache_enabled: true
  chunk_failure_policy: fail          # fail | skip
  budget:
    max_calls: null
    max_cost: null

observability:
  metrics_enabled: true
  save_raw_model_payloads: false

export:
  point_tree_layout: feature          # chapter 在状态/业务维度和功能之间补充原文章节
  formats: [json, markdown]           # P2 起加 xlsx
  include_issues: true
  include_coverage: true
