project:      # 项目配置
  name: demo
  workdir: ./workdir  # 运行产物

storage:      # 存储配置
  backend: sqlite
  database: ./workdir/data.sqlite

parsing:      # 文档解析
  formats: [pdf, docx]
  vision_enabled: false
  vision:
    max_edge: 2048
    tile_edge: 1536
    tile_overlap: 192
    max_tiles: 16                     # 局部图上限不含总览；按供应商限制配置
    detail: high                      # 不接受该参数的兼容端点可设 null
    context_blocks: 2
    context_chars: 6000
    min_edge: 64                      # 最长边小于此值跳过；0 关闭尺寸过滤
    verify: true                      # true/false/auto；auto 尚无真实对照数据
    verify_failure: fail               # fail/keep_draft；仅有效草稿允许显式降级
    auto_fact_threshold: 20            # auto 模式事实数严格超过该值时复核
  infer_docx_headings: false          # 可选推断非标准 Word 标题；默认保持原有解析
  docx_extended: false               # 大纲/中文标题样式与正文内容控件；验收后再开启
  pdf_running_text: keep             # isolate 将边缘重复行/页码标为 other，不删除

chunking:     # 分块策略
  strategy: structural    # 按结构分块
  target_tokens: 900
  overlap_tokens: 100
  token_counter: tiktoken_approx      # 近似计数；纯离线可选 character_approx
  attach_headings: false             # 标题并入下文；默认保留旧分块
  min_tokens: 0                      # 0 关闭小节合并；必须小于 target_tokens
  split_long_paragraphs: false       # 仅在句界拆超长段；长句整段保留并告警

models:      # 模型端点
  llm:       # 大语言模型
    adapter: openai_sdk               # openai_sdk | langchain | claude_sdk
    api_mode: chat_completions        # 对话协议
    response_format: json_schema     # DeepSeek Chat 改为 json_object
    thinking_mode: default           # DeepSeek Chat 可设 disabled；default 不发送此参数
    max_output_tokens: null          # 单次输出上限；留空使用服务商默认，与输入预算不同
    base_url: ""
    model: ""
    api_key: null                     # 在 workdir/local.yaml 填真实值；不进入快照或导出
    api_key_env: TC_RAG_LLM_API_KEY
    concurrency: 3                  # 请求并发数量
  embedding: # 向量模型
    adapter: openai_sdk
    base_url: ""
    model: ""
    api_key: null                     # 非空值优先；留空时兼容环境变量
    api_key_env: TC_RAG_EMBEDDING_API_KEY
    batch_size: 16    # 批量数目
    concurrency: 2
  vision:     # 图片转文字设置
    enabled: false
    supports_images: false # 开启前核对部署模型是否支持图片，再设为 true
    adapter: openai_sdk
    model: ""
    base_url: ""
    api_key: null
    api_key_env: TC_RAG_VISION_API_KEY
    supports_json_object: false       # 服务商明确支持时才发送 response_format
    max_output_tokens: null           # 建议按模型上限显式配置，防止复杂 JSON 截断
  vision_review:                       # 可选第二视觉模型；启用后图文也会发给该端点
    enabled: false
    supports_images: false
    supports_json_object: false
    adapter: openai_sdk
    api_mode: chat_completions
    model: ""
    base_url: ""
    max_output_tokens: null
    api_key: null
    api_key_env: TC_RAG_VISION_REVIEW_API_KEY
  rerank:
    enabled: false
    adapter: http
    model: "" # 智谱使用 rerank
    base_url: "" # 智谱完整 REST 地址 https://open.bigmodel.cn/api/paas/v4/rerank
    api_key: null
    api_key_env: TC_RAG_RERANK_API_KEY

retrieval:
  scope: requirement_set
  backend: numpy                      # numpy | faiss
  metric: cosine                      # cosine | euclidean | dot
  normalize: true
  embedding_dimension: 1536            # 必须等于模型实际返回维度，不自动截断
  vector_top_k: 20
  keyword_enabled: false
  rerank_top_n: 6
  threshold_policy: disabled          # 评估后按 metric 配置

planning:   # 测试点设计
  max_points_per_rule: 12 # 模型补充数量上限
  methods: [equivalence, boundary, decision_table, state, permission] # 等价类、边界值、决策表、状态转换、权限矩阵
  relation_enabled: false # 业务关系
  ui_display_policy: merge # merge=纯界面展示点合并为概括点；keep=保留旧行为
  vision_policy: aggregate # aggregate=仅图片证据不生成点并汇总问题；downgrade/keep 保留旧行为

generation:
  skill_file: null # 默认内置用例 Skill；可追加自包含 UTF-8 Markdown 文件
  max_cases_per_point: 3 # 防止模型无界扩展用例数量
  batch_point_limit: 5
  schema_repair_attempts: 1
  unsupported_expectation_policy: flag

runtime:
  max_context_tokens: 12000 # 本地输入预算，包含正文、来源元数据及输出 Schema；按实际模型能力调整
  max_attempts: 3
  request_timeout_seconds: 90
  vision_min_interval_seconds: 0 # 视觉请求启动间隔；限流时可先设 3，具体限额看账户控制台
  cache_enabled: true
  chunk_failure_policy: fail          # fail | skip；skip 时单个分块失败只记问题
  budget:
    max_calls: null
    max_cost: null

observability:
  metrics_enabled: true
  save_raw_model_payloads: false

export:
  formats: [json, markdown, xlsx]      # 用例阶段导出目标十一列 Excel
  include_issues: true
  include_coverage: true
  case_columns: []                    # 空列表使用原十一列模板；可配置 field/header
  point_tree_layout: module           # 默认按模块/章节；feature/chapter 保留旧布局
